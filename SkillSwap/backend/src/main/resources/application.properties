# Runtime configuration. Secrets are supplied through environment variables only.
server.port=${SERVER_PORT:8080}
spring.application.name=skill-swap

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillswap}
spring.datasource.username=${DB_USERNAME:skillswap}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Schema is versioned with Flyway. V1 converts the former baseline data.sql into a repeatable migration path.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.sql.init.mode=never

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Premium features are processed through RabbitMQ in production. Set the flag to
# false for a local install without a broker; Stripe webhooks then use a safe
# synchronous fallback while retaining the same idempotency guarantees.
app.messaging.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
app.messaging.rabbitmq.exchange=${RABBITMQ_EXCHANGE:skillswap.payments}
app.messaging.rabbitmq.queue=${RABBITMQ_QUEUE:skillswap.payments.fulfillment}
app.messaging.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:payment.fulfillment}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Firebase Authentication is the only JWT issuer accepted by the API.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${FIREBASE_PROJECT_ID:CHANGE_ME}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
security.bootstrap-admin-email=${INITIAL_ADMIN_EMAIL:}

# Stripe server credentials. Never expose these values to Vite/React or commit them.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Optional integrations. Populate the values in deployment secrets when the related feature is enabled.
livekit.api.url=${LIVEKIT_API_URL:http://localhost:7880}
livekit.api.key=${LIVEKIT_API_KEY:}
livekit.api.secret=${LIVEKIT_API_SECRET:}
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}
opensearch.host=${OPENSEARCH_HOST:localhost}
opensearch.port=${OPENSEARCH_PORT:9200}
opensearch.username=${OPENSEARCH_USERNAME:}
opensearch.password=${OPENSEARCH_PASSWORD:}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON:}

spring.jackson.time-zone=America/Sao_Paulo
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
logging.level.root=INFO
logging.level.org.springframework.security=WARN

# Redis
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Google Calendar
google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
google.calendar.application-name=${GOOGLE_CALENDAR_APPLICATION_NAME:SkillSwap}
google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:}